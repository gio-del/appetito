<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>appetito</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="icons.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="20" height="20"><span>appetito</span></div>
    <div class="filters">
      <input id="q" type="search">
      <span class="fsel"><select id="f-prio"></select><button type="button" class="fclear" data-clear="f-prio" hidden>×</button></span>
      <span class="fsel"><select id="f-label"></select><button type="button" class="fclear" data-clear="f-label" hidden>×</button></span>
      <select id="f-entry"></select>
      <button type="button" id="f-stale" class="btn ghost fstale" aria-pressed="false" hidden></button>
    </div>
    <div class="actions">
      <a id="auto-pill" class="auto-pill" href="auto.html"></a>
      <a id="settings-link" class="btn ghost icon" href="settings.html"></a>
      <button id="new" class="btn primary"></button>
      <button id="logout" class="btn ghost"></button>
    </div>
  </header>
  <button id="waiting" class="waiting" type="button" hidden></button>
  <nav id="tabs" class="tabs"></nav>
  <main id="board" class="board"></main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="panel-head">
      <span id="d-id" class="muted"></span>
      <span id="d-dirty" class="muted small"></span>
      <button class="btn ghost icon" data-close>✕</button>
    </div>
    <div id="d-body" class="panel-body"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
