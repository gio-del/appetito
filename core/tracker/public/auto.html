<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>Worker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="icons.js" defer></script>
<script src="auto.js" defer></script>
</head>
<body class="au-body">
<main class="au" id="au">
  <header class="au-top">
    <a href="/" class="au-back" id="au-back"></a>
    <h1 id="au-title"></h1>
    <span class="au-live" id="au-live"></span>
    <button class="au-iconbtn" id="au-help"></button>
  </header>
  <section class="au-hero" id="au-hero"></section>
  <section class="au-section" id="au-current" hidden></section>
  <section class="au-tiles" id="au-gates"></section>
  <section class="au-section" id="au-limits"></section>
  <section class="au-section" id="au-queue"></section>
  <section class="au-section" id="au-history"></section>
  <p id="au-msg" class="err" role="alert"></p>
</main>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
