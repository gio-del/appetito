<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>Issue dei Progetti</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="projects.js" defer></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="20" height="20"><span>Progetti</span></div>
    <div class="filters">
      <select id="pj-filter" aria-label="Progetto"></select>
      <label class="small pj-closed"><input type="checkbox" id="pj-closed"> anche chiuse</label>
    </div>
    <div class="actions"><a class="auto-pill" href="/" title="Torna alla board"><span class="lbl">Board</span><span aria-hidden="true">←</span></a></div>
  </header>
  <main class="pj-main">
    <div id="pr-list"></div>
    <div id="rel-list"></div>
    <p class="muted small">Copia in sola lettura delle issue su GitHub (GitHub resta la fonte). Solo quelle create da te o che ti sei assegnato da solo possono diventare lavoro per Claude; le altre sono <b>non fidate</b>.</p>
    <div id="pj-list"></div>
    <p id="pj-msg" class="muted small" role="status"></p>
  </main>
</div>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="panel-head">
      <span id="d-id" class="muted"></span>
      <button class="btn ghost icon" data-close aria-label="Chiudi">✕</button>
    </div>
    <div id="d-body" class="panel-body"></div>
  </section>
</div>
</body>
</html>
