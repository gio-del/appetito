# /etc/ssh/sshd_config.d/home-server.conf (rendered by device/edge/deploy: @HS_USER@)
# Listen on localhost only: tailnet SSH arrives through tailscaled's userspace
# forwarding (the Tailscale ACL limits it to the admin PC) and `adb forward
# tcp:2222 tcp:22` also lands on localhost. The home LAN can't reach it.
ListenAddress 127.0.0.1
Port 22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers @HS_USER@
UsePAM no
X11Forwarding no
MaxAuthTries 3
